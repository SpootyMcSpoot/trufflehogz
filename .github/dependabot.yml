version: 2
updates:
- package-ecosystem: pip
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
- package-ecosystem: github-actions
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
- package-ecosystem: docker-compose
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
- package-ecosystem: terraform
  directory: /terraform
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
multi-ecosystem-groups:
  weekly-patches:
    schedule:
      interval: weekly
      day: saturday
      time: '22:14'
      timezone: UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
