# Self-Scan Workflow
# Runs TruffleHog against this repository to validate detection capabilities
# and verify the scanner processes findings correctly.

name: Self-Scan Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_public_orgs:
        description: 'Scan public GitHub orgs'
        required: false
        default: false
        type: boolean
      public_orgs:
        description: 'Comma-separated list of public orgs to scan (e.g., "OWASP,trufflesecurity")'
        required: false
        default: ''
        type: string

env:
  # Default public orgs for testing (only used when scan_public_orgs is true)
  # These are intentionally vulnerable or test repos
  SELFSCAN_ORGS: ${{ inputs.public_orgs || '' }}

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: TruffleHog Self-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog scan
        id: scan
        run: |
          # Scan the repository and output findings as JSON
          trufflehog git file://. --json --no-verification > findings.json 2>&1 || true

          # Count findings
          FINDING_COUNT=$(wc -l < findings.json | tr -d ' ')
          echo "finding_count=$FINDING_COUNT" >> $GITHUB_OUTPUT
          echo "Found $FINDING_COUNT potential secrets"

      - name: Validate findings detected
        run: |
          EXPECTED_MIN=10  # We expect at least 10 test secrets to be found
          ACTUAL=${{ steps.scan.outputs.finding_count }}

          echo "Expected at least $EXPECTED_MIN findings, got $ACTUAL"

          if [ "$ACTUAL" -lt "$EXPECTED_MIN" ]; then
            echo "ERROR: TruffleHog did not detect expected test fixtures"
            echo "This may indicate a problem with the scanner or test data"
            exit 1
          fi

          echo "SUCCESS: TruffleHog detected $ACTUAL test secrets as expected"

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-findings
          path: findings.json
          retention-days: 7

  public-org-scan:
    name: Public Org Scan
    runs-on: ubuntu-latest
    if: ${{ inputs.scan_public_orgs == true && inputs.public_orgs != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan public orgs
        id: public_scan
        env:
          ORGS_LIST: ${{ inputs.public_orgs }}
        run: |
          echo "Scanning public orgs: $ORGS_LIST"

          # Create output directory
          mkdir -p public-findings

          TOTAL_FINDINGS=0
          ORGS_SCANNED=0

          # Split comma-separated list and scan each org
          IFS=',' read -ra ORGS <<< "$ORGS_LIST"
          for org in "${ORGS[@]}"; do
            # Trim whitespace
            org=$(echo "$org" | xargs)

            if [ -z "$org" ]; then
              continue
            fi

            echo "----------------------------------------"
            echo "Scanning org: $org"
            echo "----------------------------------------"

            # Scan org's public repos (no verification to avoid API calls)
            OUTPUT_FILE="public-findings/${org}.json"
            trufflehog github --org="$org" --json --no-verification > "$OUTPUT_FILE" 2>&1 || true

            # Count findings for this org
            ORG_FINDINGS=$(wc -l < "$OUTPUT_FILE" | tr -d ' ')
            echo "Found $ORG_FINDINGS potential secrets in $org"

            TOTAL_FINDINGS=$((TOTAL_FINDINGS + ORG_FINDINGS))
            ORGS_SCANNED=$((ORGS_SCANNED + 1))
          done

          echo "----------------------------------------"
          echo "SUMMARY"
          echo "----------------------------------------"
          echo "Orgs scanned: $ORGS_SCANNED"
          echo "Total findings: $TOTAL_FINDINGS"

          # Combine all findings
          cat public-findings/*.json > public-findings/all-findings.json 2>/dev/null || touch public-findings/all-findings.json

          echo "orgs_scanned=$ORGS_SCANNED" >> $GITHUB_OUTPUT
          echo "total_findings=$TOTAL_FINDINGS" >> $GITHUB_OUTPUT

      - name: Upload public org findings
        uses: actions/upload-artifact@v4
        with:
          name: public-org-findings
          path: public-findings/
          retention-days: 7

      - name: Summary
        run: |
          echo "## Public Org Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Orgs Scanned**: ${{ steps.public_scan.outputs.orgs_scanned }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Findings**: ${{ steps.public_scan.outputs.total_findings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Findings artifacts are available for download." >> $GITHUB_STEP_SUMMARY

  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff linter
        run: |
          ruff check trufflehog_scanner.py scripts/ --ignore E501

      - name: Run ruff formatter check
        run: |
          ruff format --check trufflehog_scanner.py scripts/ || true

  scanner-test:
    name: Scanner Unit Test
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          name: trufflehog-findings

      - name: Test scanner validation mode
        run: |
          python trufflehog_scanner.py \
            --json findings.json \
            --validate \
            --org test-org \
            --log-level INFO

      - name: Test scanner dry-run mode
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python trufflehog_scanner.py \
            --json findings.json \
            --dry-run \
            --org test-org \
            --title-prefix "[Test]" \
            --print-sanitized 5 \
            --log-level DEBUG
