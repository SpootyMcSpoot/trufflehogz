# Workflow Linting — validates all .github/workflows/*.yml on every PR
# Uses actionlint for syntax/type/expression checks and ghalint for
# security-policy enforcement (permissions, SHA pinning, timeout, etc.)

name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.11"
          curl -sSLo actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash"
          bash actionlint.bash "$ACTIONLINT_VERSION"
          echo "actionlint $ACTIONLINT_VERSION installed"

      - name: Run actionlint
        run: |
          set -euo pipefail
          ./actionlint -color -verbose

  ghalint:
    name: ghalint (security policies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          set -euo pipefail
          GHALINT_VERSION="v1.5.5"
          curl -sSL \
            "https://github.com/suzuki-shunsuke/ghalint/releases/download/${GHALINT_VERSION}/ghalint_${GHALINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin ghalint
          chmod +x /usr/local/bin/ghalint
          echo "ghalint ${GHALINT_VERSION} installed"

      - name: Run ghalint
        env:
          GHALINT_LOG_COLOR: always
        run: |
          set -euo pipefail
          ghalint run
