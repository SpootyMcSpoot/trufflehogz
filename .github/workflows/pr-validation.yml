# PR Validation — comprehensive PR gate for the trufflehog repo
# Adapted from slac-templates/pr-validation.yml + action-validator.yml
# Runs: actionlint, yamllint, SHA-pinning enforcement, permissions audit
# BLOCKS MERGE if any critical validation fails

name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: Workflow Syntax
  # ============================================================================

  validate-workflow-syntax:
    name: Validate Workflow Syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.11"
          curl -sSLo actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash"
          bash actionlint.bash "$ACTIONLINT_VERSION"

      - name: Run actionlint on all workflows
        run: |
          set -euo pipefail
          FAILED=0

          while IFS= read -r wf; do
            echo ""
            echo "Checking: ${wf}"
            if ./actionlint -shellcheck="shellcheck -e SC2086 -e SC2309" "$wf"; then
              echo "  [OK] Valid"
            else
              echo "  [ERROR] FAILED"
              FAILED=$((FAILED + 1))
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))

          {
            echo "## Workflow Syntax Validation"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "✅ All workflow files passed actionlint validation"
            else
              echo "❌ $FAILED workflow file(s) failed validation"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$FAILED" -gt 0 ] && exit 1 || true

  # ============================================================================
  # STAGE 2: YAML Lint
  # ============================================================================

  validate-yaml-syntax:
    name: Validate YAML Syntax (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install --user yamllint

      - name: Run yamllint
        run: |
          set -euo pipefail

          cat > /tmp/.yamllint.yml <<'EOF'
          extends: default
          rules:
            line-length: disable
            comments:
              min-spaces-from-content: 1
            document-start: disable
            truthy:
              allowed-values: ['true', 'false', 'on', 'off']
            trailing-spaces: disable
            empty-lines:
              max: 2
          EOF

          if yamllint -c /tmp/.yamllint.yml .github/workflows/*.yml 2>&1; then
            echo "## YAML Syntax Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ All YAML files passed yamllint validation" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## YAML Syntax Validation"
              echo ""
              echo "❌ YAML validation failed — please fix errors above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================================
  # STAGE 3: Action SHA-Pinning + Trusted Org Validation
  # ============================================================================

  validate-actions:
    name: Validate Action Pinning & Trust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Validate GitHub Actions SHA-pinning
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          UNPINNED_COUNT=0
          UNTRUSTED_COUNT=0
          TOTAL_ACTIONS=0

          # Trusted orgs for trufflehog repo
          TRUSTED_ORGS=("actions" "github" "docker" "trufflesecurity")

          echo "Trusted organizations: ${TRUSTED_ORGS[*]}"
          echo ""

          UNPINNED_FILE=$(mktemp)
          UNTRUSTED_FILE=$(mktemp)

          while IFS= read -r workflow_file; do
            echo "Checking: ${workflow_file}"

            grep -n '^\s*uses:' "$workflow_file" | while IFS=: read -r line_num line_content; do
              TOTAL_ACTIONS=$((TOTAL_ACTIONS + 1))

              action=$(echo "$line_content" | sed 's/^\s*uses:\s*//' | sed 's/\s*#.*//' | xargs)

              # Skip local actions
              if [[ "$action" =~ ^\.\/ ]]; then
                echo "  [OK] Local: $action"
                continue
              fi

              # Skip Docker actions
              if [[ "$action" =~ ^docker:// ]]; then
                echo "  [INFO] Docker action: $action"
                continue
              fi

              # Parse owner/repo@ref
              if [[ "$action" =~ ^([^/]+)/([^@]+)@([^[:space:]]+) ]]; then
                owner="${BASH_REMATCH[1]}"
                ref="${BASH_REMATCH[3]}"

                # Check SHA-pinning (40-char hex)
                if [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
                  echo "  [OK] SHA-pinned: $action"
                else
                  echo "  [ERROR] NOT SHA-pinned: $action"
                  UNPINNED_COUNT=$((UNPINNED_COUNT + 1))
                  echo "$workflow_file:$line_num: $action" >> "$UNPINNED_FILE"
                fi

                # Check trusted org
                IS_TRUSTED="false"
                for org in "${TRUSTED_ORGS[@]}"; do
                  if [ "$owner" = "$org" ]; then
                    IS_TRUSTED="true"
                    break
                  fi
                done
                if [ "$IS_TRUSTED" = "false" ]; then
                  UNTRUSTED_COUNT=$((UNTRUSTED_COUNT + 1))
                  echo "$workflow_file:$line_num: $action (org: $owner)" >> "$UNTRUSTED_FILE"
                fi
              fi
            done || true
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))

          # Read counts from files (subshell piping resets variables)
          UNPINNED_COUNT=$(wc -l < "$UNPINNED_FILE" 2>/dev/null | tr -d ' ')
          UNTRUSTED_COUNT=$(wc -l < "$UNTRUSTED_FILE" 2>/dev/null | tr -d ' ')
          UNPINNED_COUNT=${UNPINNED_COUNT:-0}
          UNTRUSTED_COUNT=${UNTRUSTED_COUNT:-0}

          {
            echo "## Action Validator Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Unpinned actions | **${UNPINNED_COUNT}** |"
            echo "| Untrusted orgs | **${UNTRUSTED_COUNT}** |"
            echo ""
            echo "**Trusted orgs:** \`actions, github, docker, trufflesecurity\`"
            echo ""

            if [ "${UNPINNED_COUNT}" -gt 0 ]; then
              echo "### ❌ Unpinned Actions"
              echo ""
              echo '```'
              cat "$UNPINNED_FILE"
              echo '```'
              echo ""
              echo "**Fix:** Pin actions by full commit SHA."
              echo '```yaml'
              echo "# Bad:  uses: actions/checkout@v4"
              echo "# Good: uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2"
              echo '```'
            fi

            if [ "${UNTRUSTED_COUNT}" -gt 0 ]; then
              echo ""
              echo "### ⚠️ Untrusted Organizations (${UNTRUSTED_COUNT})"
              echo ""
              echo '```'
              cat "$UNTRUSTED_FILE"
              echo '```'
              echo ""
              echo "Review these actions or add their org to the trusted list."
            fi

            echo ""
            if [ "${UNPINNED_COUNT}" -eq 0 ] && [ "${UNTRUSTED_COUNT}" -eq 0 ]; then
              echo "### ✅ All Actions Validated"
            elif [ "${UNPINNED_COUNT}" -gt 0 ]; then
              echo "### ❌ Validation Failed"
            else
              echo "### ⚠️ Warnings Detected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f "$UNPINNED_FILE" "$UNTRUSTED_FILE"

          # Fail on unpinned actions (hard requirement)
          if [ "${UNPINNED_COUNT}" -gt 0 ]; then
            echo "::error::Found ${UNPINNED_COUNT} unpinned action(s). All actions must be SHA-pinned."
            exit 1
          fi

          # Warn on untrusted (soft requirement)
          if [ "${UNTRUSTED_COUNT}" -gt 0 ]; then
            echo "::warning::Found ${UNTRUSTED_COUNT} action(s) from untrusted organizations."
          fi

  # ============================================================================
  # STAGE 4: Permissions Audit
  # ============================================================================

  check-permissions:
    name: Check Workflow Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Verify least-privilege permissions
        shell: bash
        run: |
          set -euo pipefail
          ISSUES=0

          while IFS= read -r workflow_file; do
            echo "Checking: ${workflow_file}"

            if ! grep -q "^permissions:" "$workflow_file"; then
              echo "  [WARNING] No top-level permissions defined"
            else
              echo "  [OK] Has permissions defined"

              if grep -q "permissions:.*write-all\|permissions:.*contents:.*write" "$workflow_file"; then
                echo "  [WARNING] Potentially broad permissions detected"
              fi
            fi

            # Check for unpinned actions
            UNPINNED=$(grep -E "uses:.*@(v[0-9]|main|master|develop)" "$workflow_file" | grep -v "^\s*#" || true)
            if [ -n "$UNPINNED" ]; then
              echo "  [WARNING] Unpinned actions:"
              echo "$UNPINNED" | awk '{print "     " $0}'
              ISSUES=$((ISSUES + 1))
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))

          {
            echo "## Workflow Permissions Check"
            echo ""
            if [ "$ISSUES" -eq 0 ]; then
              echo "✅ All workflows use appropriate permissions"
            else
              echo "⚠️ $ISSUES potential permission issue(s) detected — review warnings above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 5: Python Syntax Check
  # ============================================================================

  validate-python:
    name: Validate Python Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          set -euo pipefail
          FAILED=0

          for pyfile in $(find . -name '*.py' -not -path './.git/*' -not -path './.venv/*'); do
            echo "Checking: $pyfile"
            if python3 -c "import py_compile; py_compile.compile('$pyfile', doraise=True)" 2>&1; then
              echo "  [OK] Valid"
            else
              echo "  [ERROR] Syntax error"
              FAILED=$((FAILED + 1))
            fi
          done

          {
            echo "## Python Syntax Validation"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "✅ All Python files passed syntax check"
            else
              echo "❌ $FAILED Python file(s) have syntax errors"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$FAILED" -gt 0 ] && exit 1 || true

  # ============================================================================
  # STAGE 6: Summary
  # ============================================================================

  pr-validation-summary:
    name: PR Validation Summary
    needs:
      - validate-workflow-syntax
      - validate-yaml-syntax
      - validate-actions
      - check-permissions
      - validate-python
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all validations
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## PR Validation Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Workflow Syntax (actionlint) | ${{ needs.validate-workflow-syntax.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| YAML Syntax (yamllint) | ${{ needs.validate-yaml-syntax.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Action Pinning & Trust | ${{ needs.validate-actions.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Workflow Permissions | ${{ needs.check-permissions.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Python Syntax | ${{ needs.validate-python.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0

          if [ "${{ needs.validate-workflow-syntax.result }}" != "success" ]; then
            echo "::error::Workflow syntax validation failed"
            FAILED=1
          fi

          if [ "${{ needs.validate-yaml-syntax.result }}" != "success" ]; then
            echo "::error::YAML syntax validation failed"
            FAILED=1
          fi

          if [ "${{ needs.validate-actions.result }}" != "success" ]; then
            echo "::error::Action pinning validation failed"
            FAILED=1
          fi

          if [ "${{ needs.validate-python.result }}" != "success" ]; then
            echo "::error::Python syntax validation failed"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            {
              echo "---"
              echo ""
              echo "### ❌ PR Validation FAILED"
              echo "**This PR cannot be merged until all critical checks pass.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "---"
            echo ""
            echo "### ✅ All PR Validations Passed"
            echo "This PR is ready for review."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[PASS] All validations passed"
