# Semgrep SAST — replaces CodeQL default setup
name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"  # Weekly Monday 4:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Semgrep
        uses: semgrep/semgrep-action@70a1a851cf57a77e8e453664d667c336b48a12d3  # v1.108.0
        with:
          config: "auto"
          severity: "WARNING"
          generateSarif: "true"
